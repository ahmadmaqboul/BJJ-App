name: Deploy

# Pushing to main ships the app. Two repository secrets are required:
#   CLOUDFLARE_API_TOKEN   — needs BOTH "Workers Scripts: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
#
# The Cloudflare steps run wrangler directly rather than through an action
# wrapper, so whatever wrangler prints lands in this job's log. A wrapper that
# only surfaces "npx exited 1" makes a permissions problem indistinguishable
# from a missing database.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys race: a half-applied migration is worse than a wait.
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catch a broken build before anything reaches production.
      - name: Type-check and test
        run: npm run check

      - name: Build
        run: npm run build

      # Fail here, loudly and early, rather than inside a migration.
      - name: Check Cloudflare credentials
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          echo "--- wrangler whoami (token scopes) ---"
          npx wrangler whoami || true

          echo
          echo "--- can the token see D1? ---"
          if ! npx wrangler d1 list; then
            echo "::error::The API token cannot list D1 databases. Edit the token in Cloudflare → My Profile → API Tokens and add the permission 'Account → D1 → Edit', then re-run."
            exit 1
          fi

          echo
          echo "--- is jui-jitsu-db reachable? ---"
          if ! npx wrangler d1 info jui-jitsu-db; then
            echo "::error::No D1 database named 'jui-jitsu-db' on this account, or database_id in wrangler.toml does not match it. Create it in Cloudflare → Storage & Databases → D1 and paste its Database ID into wrangler.toml."
            exit 1
          fi

      # Migrations first: the new Worker may depend on a column the old schema
      # does not have. D1 migrations are append-only, so re-running is safe.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply jui-jitsu-db --remote

      - name: Deploy worker
        run: npx wrangler deploy

      - name: Where it went
        run: |
          echo "Deployed. The workers.dev URL is printed in the step above."
          echo "If this is the first deploy, create your admin login next — see README step 4."
